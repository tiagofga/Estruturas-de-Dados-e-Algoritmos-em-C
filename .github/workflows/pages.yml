name: deploy-pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/build-site.sh'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install site dependencies
        run: python -m pip install -r requirements.txt

      - name: Build static site
        run: bash scripts/build-site.sh

      - name: Install Pages publisher
        run: python -m pip install ghp-import

      - name: Publish gh-pages branch
        run: ghp-import -n -p -f site
